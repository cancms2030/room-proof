site:
  name: 净证
  site: 'https://yourdomain.com' # 【待替换】
  base: '/'
  trailingSlash: true
  defaultLanguage: 'zh-CN'
  googleSiteVerificationId: '' # 【待替换】

# Default SEO metadata
metadata:
  title:
    default: 净证-酒店保洁管理系统_客房质检软件
    template: '%s — 净证'
  description: "让每一间客房的清洁，都有据可查。净证客房保洁质检系统，专为中小酒店设计，支持拍照提交、主管在线审核、一键生成报表。"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 净证
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@yourhandle' # 【待替换】
    site: '@yourhandle' # 【待替换】
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
